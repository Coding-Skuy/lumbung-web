name: schemathesis
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL backend/mock yang diuji
        required: true
        default: http://localhost:8080
      tags:
        description: Tag operasi (dipisah koma)
        default: Publik,Admin
      max_examples:
        description: Contoh per operasi
        default: "25"
permissions:
  contents: read
jobs:
  schemathesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install schemathesis
      - name: Jalankan Schemathesis
        env:
          GH_TOKEN: ${{ secrets.BACKEND_READ_TOKEN || github.token }}
          ADMIN_TOKEN: ${{ secrets.LUMBUNG_ADMIN_TOKEN }}
          BASE_URL: ${{ inputs.base_url }}
          TAGS: ${{ inputs.tags }}
          MAX_EXAMPLES: ${{ inputs.max_examples }}
        run: contract/schemathesis.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schemathesis-junit
          path: contract/.out/schemathesis-junit.xml
          if-no-files-found: ignore
